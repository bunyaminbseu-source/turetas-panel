<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<script>window.PANEL_API='https://script.google.com/macros/s/AKfycby1WGIU0iC2NTpw8dorCUJ5bZ4_az0BbnjpKWDPpFVZht8hYesxX5H1s8Xzd6eJ7UY/exec';</script>
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Türetaş Proje Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: koyu "çizim masası" kenar çubuğu (mimarlar) + açık çalışma alanı (işler) + sağdan açılan iş dosyası */
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --panel-2:#F5F7FA; --line:#DDE2EA; --line-2:#E9EDF2;
  --ink:#131B2A; --muted:#5F6B82; --faint:#8F99AC;
  --brass:#A87300; --brass-ink:#FFFFFF; --brass-soft:rgba(168,115,0,.10);
  --side:#0E1522; --side-2:#151E2F; --side-line:#222D42; --side-ink:#E4E9F2; --side-muted:#8592A8; --side-brass:#F2B91E;
  --grid:rgba(19,27,42,.045);
  --ok:#23885D; --ok-soft:rgba(35,136,93,.11);
  --warn:#B9790B; --warn-soft:rgba(185,121,11,.12);
  --bad:#C23B31; --bad-soft:rgba(194,59,49,.10);
  --info:#3563C4; --info-soft:rgba(53,99,196,.10);
  --mim:#6A5ED6; --ele:#C08410; --mek:#17908A; --bel:#667085;
  --shadow:0 1px 2px rgba(15,22,36,.05),0 8px 24px rgba(15,22,36,.06);
  --shadow-lg:0 24px 64px rgba(10,15,26,.28);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F18; --panel:#111926; --panel-2:#162031; --line:#232E44; --line-2:#1B2538;
  --ink:#E5EAF2; --muted:#93A0B6; --faint:#6C7890;
  --brass:#F2B91E; --brass-ink:#17130A; --brass-soft:rgba(242,185,30,.12);
  --side:#070B12; --side-2:#0F1622; --side-line:#1C2537;
  --grid:rgba(229,234,242,.035);
  --ok:#47BF8A; --ok-soft:rgba(71,191,138,.13);
  --warn:#E7AE45; --warn-soft:rgba(231,174,69,.13);
  --bad:#EC6A5E; --bad-soft:rgba(236,106,94,.13);
  --info:#80A3F0; --info-soft:rgba(128,163,240,.13);
  --mim:#9C93F3; --ele:#E9B84E; --mek:#45C3B8; --bel:#9CA6B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F18; --panel:#111926; --panel-2:#162031; --line:#232E44; --line-2:#1B2538;
  --ink:#E5EAF2; --muted:#93A0B6; --faint:#6C7890;
  --brass:#F2B91E; --brass-ink:#17130A; --brass-soft:rgba(242,185,30,.12);
  --side:#070B12; --side-2:#0F1622; --side-line:#1C2537;
  --grid:rgba(229,234,242,.035);
  --ok:#47BF8A; --ok-soft:rgba(71,191,138,.13);
  --warn:#E7AE45; --warn-soft:rgba(231,174,69,.13);
  --bad:#EC6A5E; --bad-soft:rgba(236,106,94,.13);
  --info:#80A3F0; --info-soft:rgba(128,163,240,.13);
  --mim:#9C93F3; --ele:#E9B84E; --mek:#45C3B8; --bel:#9CA6B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
.mark{width:58px;height:40px;border-radius:7px;background:#FFFFFF;display:grid;place-items:center;flex:none;padding:3px 4px}
.mark img{display:block;width:100%;height:100%;object-fit:contain}
.logo-full{display:block;background:#FFFFFF;border-radius:12px;padding:14px 18px;margin-bottom:22px}
.logo-full img{display:block;width:100%;max-width:260px;margin:0 auto}
.brand b{font:700 15px/1.1 var(--f-display);letter-spacing:.01em;display:block}
.brand small{font:500 10.5px/1.2 var(--f-mono);color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase}
.side-search{margin:0 16px 14px;position:relative}
.side-search input{width:100%;background:var(--side-2);border:1px solid var(--side-line);border-radius:8px;padding:9px 12px 9px 34px;color:var(--side-ink);outline:none}
.side-search input::placeholder{color:var(--side-muted)}
.side-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--side-muted)}
.side-label{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 8px;font:600 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted)}
.side-label button{background:none;border:1px solid var(--side-line);color:var(--side-brass);border-radius:6px;padding:4px 8px;font:600 11px/1 var(--f-body);letter-spacing:0;text-transform:none}
.side-label button:hover{border-color:var(--side-brass)}
.arch-list{flex:1;overflow:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:2px}
.arch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--side-ink)}
.arch:hover{background:var(--side-2)}
.arch.on{background:var(--side-2);box-shadow:inset 2px 0 0 var(--side-brass)}
.arch .av{width:30px;height:30px;border-radius:7px;background:#1D273A;color:var(--side-brass);display:grid;place-items:center;font:700 11.5px/1 var(--f-display);flex:none;letter-spacing:.02em}
.arch.all .av{background:transparent;border:1px dashed var(--side-line);color:var(--side-muted)}
.arch .nm{flex:1;min-width:0}
.arch .nm b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch .nm small{display:block;color:var(--side-muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch .ct{font:500 11px/1 var(--f-mono);color:var(--side-muted);border:1px solid var(--side-line);border-radius:20px;padding:3px 7px}
.arch .ct.hot{color:var(--side-brass);border-color:rgba(211,174,104,.4)}
.side-foot{border-top:1px solid var(--side-line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--side-muted)}
.side-foot .me{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .me b{color:var(--side-ink);font-weight:500}
.side-foot button{background:none;border:0;color:var(--side-muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:relative;padding-block:28px 22px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.eyebrow .demo{color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 8px;letter-spacing:.06em;background:var(--panel)}
h1{font:700 30px/1.1 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.top-sub{color:var(--muted);margin-top:6px;font-size:13.5px}
.top-sub a{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:13.5px;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}

.tabs-top{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.ttab{display:flex;align-items:baseline;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;color:var(--muted);text-align:left;min-width:180px}
.ttab span{font:500 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.ttab b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.ttab small{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto}
.ttab:hover{border-color:var(--faint)}
.ttab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ttab.on b{color:var(--bg)} .ttab.on small{color:var(--bg);opacity:.65}

.body{padding-block:22px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* Mimar grupları */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.grp.kapali .grp-h{border-bottom:0}
.grp-tog{display:flex;align-items:center;gap:14px;flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;color:var(--ink)}
.grp-tog .av{width:38px;height:38px;border-radius:9px;background:var(--side);color:var(--side-brass);display:grid;place-items:center;font:700 13px/1 var(--f-display);flex:none}
.grp-tog .nm{min-width:0;flex:1}
.grp-tog .nm b{display:block;font:700 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-tog .nm small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-tog .chev{color:var(--faint);transition:transform .15s;flex:none}
.grp.kapali .chev{transform:rotate(-90deg)}
.grp-sum{text-align:right;flex:none}
.grp-sum span{display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.grp-sum b{font:600 15px/1 var(--f-body);font-variant-numeric:tabular-nums}
.grp-act{display:flex;gap:6px;flex:none}

.jobs-head,.job{display:grid;grid-template-columns:78px minmax(0,1fr) 168px 168px 120px;gap:14px;align-items:center;padding:0 18px}
.jobs-head{height:34px;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line-2)}
.jobs-head .r,.job .para{text-align:right}
.job{min-height:60px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);padding-block:10px}
.job:last-child{border-bottom:0}
.job:hover{background:var(--panel-2)}
.job .kod{font:500 12px/1 var(--f-mono);color:var(--muted)}
.job .kod i{display:inline-block;margin-top:6px;font-style:normal;font:600 9.5px/1 var(--f-mono);letter-spacing:.08em;color:var(--warn);border:1px solid currentColor;border-radius:3px;padding:2px 4px}
.job .ttl{min-width:0}
.job .ttl b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .ttl small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .tar{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.job .para{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.job .para.yok{color:var(--faint);font-weight:400}
.grp-bos{padding:18px;color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* Disiplin durum rozeti */
.dz{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;border:1px solid transparent}
.dz::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.dz em{display:none;font-style:normal;font:600 10px/1 var(--f-mono);letter-spacing:.06em;opacity:.8}
.dz-Bekliyor{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.dz-Çizim{background:var(--info-soft);color:var(--info)}
.dz-Revizyonda{background:var(--warn-soft);color:var(--warn)}
.dz-Teslim{background:var(--ok-soft);color:var(--ok)}
.dz-Kapsam{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.dz-Kapsam::before{background:transparent;border:1px solid currentColor}

.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px/1.3 var(--f-display);margin-bottom:6px}
.empty .btn{margin-top:14px}
.jobs{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

/* ---------- Çekmece (iş dosyası) ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,15,.48);backdrop-filter:blur(2px);z-index:40;animation:fade .18s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .24s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
.dr-head{padding:20px 24px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.dr-top .kod{font:500 12px/1 var(--f-mono);color:var(--brass);letter-spacing:.06em}
.x{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.dr-head h2{margin:0;font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.dr-head .meta{color:var(--muted);margin-top:6px;font-size:13px}
.quick{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.q-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center}
.q-row>span{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.secim{display:flex;flex-wrap:wrap;gap:6px}
.kutu{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:13px;font-weight:500;color:var(--muted);line-height:1.2}
.kutu::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--faint);flex:none;box-sizing:border-box}
.kutu:hover{border-color:var(--faint)}
.kutu.on{border-color:currentColor;background:var(--panel-2)}
.kutu.on::before{border-color:currentColor;background:currentColor;box-shadow:inset 0 0 0 2.5px var(--panel)}
.kutu.on.k-Bekliyor{color:var(--ink)}
.kutu.on.k-Çizim{color:var(--info);background:var(--info-soft)}
.kutu.on.k-Revizyonda{color:var(--warn);background:var(--warn-soft)}
.kutu.on.k-Teslim{color:var(--ok);background:var(--ok-soft)}
.kutu.on.k-Kapsam{color:var(--faint)}
.fld>span>span{letter-spacing:0}
.kapsam{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel-2);min-width:0}
.cb:hover{border-color:var(--faint)}
.cb input{position:absolute;opacity:0;pointer-events:none}
.cb-k{width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;background:var(--panel)}
.cb b{display:block;font-weight:600;font-size:14px}
.cb small{display:block;color:var(--muted);font-size:12px}
.cb>span:last-child{min-width:0}
.cb:has(input:checked){border-color:var(--brass);background:var(--brass-soft)}
.cb input:checked+.cb-k{background:var(--brass);border-color:var(--brass)}
.cb input:checked+.cb-k::after{content:"";width:6px;height:11px;border:solid var(--brass-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb input:focus-visible+.cb-k{outline:2px solid var(--brass);outline-offset:2px}
.drop.mini{padding:12px 14px;cursor:pointer}
.drop.mini .ic{width:34px;height:34px}
.drop.mini p{min-width:0}
.drop.mini p b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick label{display:flex;flex-direction:column;gap:5px;font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dr-body{flex:1;overflow:auto;padding:20px 24px 32px;display:flex;flex-direction:column;gap:20px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bedel-b{display:block;font:700 22px/38px var(--f-display);letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.bedel-b .bos{color:var(--faint);font:400 13px/38px var(--f-body)}
.kapsam-yok{display:block;font-style:normal;font:400 13px/34px var(--f-body);letter-spacing:0;text-transform:none;color:var(--faint)}
.fact{background:var(--panel);padding:11px 13px;min-width:0}
.fact span{display:block;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.fact b{font-weight:500;font-size:13.5px;display:block;overflow-wrap:anywhere}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note:empty{display:none}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sec-t h3{margin:0;font:600 15px/1 var(--f-display)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 9px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;margin-bottom:-1px}
.tab .sw{width:8px;height:8px;border-radius:2px}
.tab .n{font:500 11px/1 var(--f-mono);color:var(--faint)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;background:var(--panel);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--brass);background:var(--brass-soft)}
.drop .ic{width:40px;height:40px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;color:var(--brass);flex:none}
.drop p{margin:0;flex:1;min-width:0;font-size:13px;color:var(--muted)}
.drop p b{color:var(--ink);font-weight:600;display:block;font-size:13.5px}
.files{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.file{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.file:last-child{border-bottom:0}
.ext{width:44px;height:50px;border-radius:5px;border:1px solid var(--line);position:relative;display:grid;place-items:end center;padding-bottom:7px;font:600 9.5px/1 var(--f-mono);letter-spacing:.04em;background:var(--panel-2)}
.ext::before{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:linear-gradient(225deg,var(--bg) 50%,var(--line) 50%);border-bottom-left-radius:3px}
.ext.dwg,.ext.dxf{color:var(--mim)} .ext.pdf{color:var(--bad)} .ext.xls,.ext.xlsx{color:var(--ok)} .ext.doc,.ext.docx{color:var(--info)} .ext.img{color:var(--mek)} .ext.zip,.ext.rar{color:var(--warn)}
.file .fn{min-width:0}
.file .fn b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fn small{display:block;color:var(--muted);font-size:12px}
.file .fa{display:flex;gap:6px}
.file.up{opacity:.7}
.file.up .fn small{color:var(--brass)}
.files .empty{padding:26px}
.dr-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}

/* ---------- Modal / form ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .scrim{position:absolute;z-index:0}
.card{position:relative;z-index:1;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}}
.card-h{padding:20px 22px 0}
.card-h h3{margin:0;font:700 19px/1.2 var(--f-display)}
.card-h p{margin:6px 0 0;color:var(--muted);font-size:13px}
.form{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 11px;outline:none;min-width:0}
.inp:focus{border-color:var(--brass);background:var(--panel)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.card-f{display:flex;justify-content:space-between;gap:8px;padding:14px 22px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.card-f .r{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:13px;padding:0 22px}

/* ---------- Giriş ---------- */
.login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--side);
  background-image:linear-gradient(rgba(211,174,104,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(211,174,104,.05) 1px,transparent 1px);background-size:32px 32px;color:var(--side-ink)}
.login-card{width:min(400px,100%);background:var(--side-2);border:1px solid var(--side-line);border-radius:16px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.login-card h1{color:var(--side-ink);font-size:26px}
.login-card p{color:var(--side-muted);margin:8px 0 22px;font-size:13.5px}
.login-card .fld>span{color:var(--side-muted)}
.login-card .inp{background:var(--side);border-color:var(--side-line);color:var(--side-ink)}
.login-card .inp:focus{border-color:var(--side-brass)}
.login-card form{display:flex;flex-direction:column;gap:14px}
.login-card .btn.pri{justify-content:center;padding:11px;background:var(--side-brass);border-color:var(--side-brass);color:#1A1408;margin-top:4px}
.login-card .err{padding:0;color:#F08A80}
.login-card .hint{font:400 11.5px/1.5 var(--f-mono);color:var(--side-muted);margin-top:18px;border-top:1px solid var(--side-line);padding-top:14px}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:80;box-shadow:var(--shadow-lg);animation:pop .2s ease;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.loading{display:grid;place-items:center;min-height:240px;color:var(--muted);font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Mobil ---------- */
.m-only{display:none}
@media (max-width:1040px){
  .jobs-head{display:none}
  .job{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"ttl para" "e m";gap:8px 12px;padding:14px 16px}
  .job .kod{display:none}
  .job .ttl{grid-area:ttl}.job .para{grid-area:para}.job .tar{grid-area:tar}
  .job .de{grid-area:e;min-width:0}.job .dm{grid-area:m;min-width:0}
  .dz em{display:inline}
  .job .ttl b::before{content:attr(data-kod) "  ";font:500 11.5px var(--f-mono);color:var(--muted)}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-left:0}
  .brand{padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand .m-only{display:inline-flex;margin-left:auto}
  .side-search{margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));margin-bottom:10px}
  .side-label{display:none}
  .arch-list{flex-direction:row;overflow-x:auto;padding-block:0 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:6px}
  .arch{flex:none;width:auto;max-width:220px;border:1px solid var(--side-line);padding:7px 10px}
  .arch.on{box-shadow:none;border-color:var(--side-brass)}
  .arch .av{width:24px;height:24px;font-size:10px}
  .arch .nm small{display:none}
  .side-foot{display:none}
  .top{padding-block:20px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .body{padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:24px}
  .ttab{min-width:0;flex:1}
  .grp-h{flex-wrap:wrap}.grp-sum{text-align:left}
  .dr-head{padding:16px 16px 14px}.dr-body{padding:16px 16px 28px}
  .q-row{grid-template-columns:1fr;gap:6px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}
  .actions .btn.ghost.hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var TURLER = ['Konut','Villa','Ticari','Ofis','Sanayi / Fabrika','Sağlık','Eğitim','Otel','Kamu','Diğer'];
var DISIPLINLER = [
  {k:'mimari',  ad:'Mimari',   renk:'var(--mim)'},
  {k:'elektrik',ad:'Elektrik', renk:'var(--ele)'},
  {k:'mekanik', ad:'Mekanik',  renk:'var(--mek)'},
  {k:'belgeler',ad:'Belgeler', renk:'var(--bel)'}
];

/* =================== Durum =================== */
var S = {
  kisi:'', sifre:'', girildi:false, yukleniyor:true,
  data:{mimarlar:[],projeler:[],kayit:[],klasorUrl:''},
  secMimar:'', filtre:'aktif', ara:'', kapali:{},
  acik:null, sekme:'mimari', dosyalar:null, yuklemeler:[],
  modal:null
};
var GAS = typeof google !== 'undefined' && google.script && google.script.run;

function oku(k){ try{ return localStorage.getItem('pp_'+k) || '' }catch(e){ return '' } }
function yaz(k,v){ try{ v ? localStorage.setItem('pp_'+k,v) : localStorage.removeItem('pp_'+k) }catch(e){} }

/* =================== Sunucu =================== */
function call(islem, veri){
  veri = Object.assign({kisi:S.kisi}, veri||{});
  if (!GAS && window.PANEL_API) {
    return fetch(window.PANEL_API, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, credentials:'omit',
      body: JSON.stringify({sifre:S.sifre, islem:islem, veri:veri})
    }).then(function(r){ if(!r.ok) throw new Error('Sunucuya ulaşılamadı ('+r.status+'). İnternet bağlantınızı kontrol edin.'); return r.json() })
      .then(function(r){ if(!r.ok) throw new Error(r.hata||'Bilinmeyen hata'); return r.veri })
      .catch(function(e){ if(e instanceof TypeError) throw new Error('Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edin.'); throw e });
  }
  if (!GAS) return demo(islem, veri);
  return new Promise(function(res, rej){
    google.script.run
      .withSuccessHandler(function(s){ try{ res(JSON.parse(s)) }catch(e){ res(s) } })
      .withFailureHandler(function(e){ rej(new Error((e && e.message) || String(e))) })
      .api(S.sifre, islem, veri);
  });
}

/* =================== Yardımcılar =================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}) }
function $(s,el){ return (el||document).querySelector(s) }
function bas(ad){ var p=String(ad||'?').trim().split(/\s+/); return ((p[0]||'')[0]||'' ) + ((p.length>1?p[p.length-1][0]:p[0][1])||'') }
function bugun(){ var d=new Date(); d.setHours(0,0,0,0); return d }
function tarih(s){ if(!s) return null; var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null }
var AYLAR=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function tr(s){ var d=tarih(s); return d? d.getDate()+' '+AYLAR[d.getMonth()]+' '+d.getFullYear() : '—' }
function dd(v){ v=ESKI[v]||v; return DISIPLIN_DURUM.indexOf(v)>=0 ? v : 'Bekliyor' }
function teslimEdildi(p){
  var k=[dd(p.elektrik),dd(p.mekanik)].filter(function(x){return x!=='Kapsam dışı'});
  return k.length>0 && k.every(function(x){return x==='Teslim edildi'});
}
function aktif(p){ return !teslimEdildi(p) }
function sayi(v){ return +String(v==null?'':v).replace(/[^\d]/g,'') || 0 }
function para(v){ var n=sayi(v); return n ? new Intl.NumberFormat('tr-TR').format(n)+' ₺' : '' }
function toplam(ps){ return ps.reduce(function(t,p){return t+sayi(p.bedel)},0) }
function boyut(b){ b=+b||0; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1).replace('.',',')+' MB' }
function uzanti(ad){ var m=String(ad).match(/\.([a-z0-9]{2,5})$/i); return m?m[1].toLowerCase():'' }
function extSinif(e){ if(/^(jpe?g|png|gif|webp|heic|tiff?)$/.test(e)) return 'img'; return e }
function mimar(id){ return S.data.mimarlar.find(function(m){return m.id===id}) }
function proje(id){ return S.data.projeler.find(function(p){return p.id===id}) }
function goreli(s){
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/); if(!m) return s;
  var d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]); var dk=Math.round((Date.now()-d)/6e4);
  if(dk<1) return 'şimdi'; if(dk<60) return dk+' dk önce'; if(dk<1440) return Math.round(dk/60)+' sa önce';
  if(dk<2880) return 'dün '+m[4]+':'+m[5]; return (+m[3])+' '+AYLAR[+m[2]-1]+' '+m[4]+':'+m[5];
}
function toast(msg, kotu){
  var t=document.createElement('div'); t.className='toast'+(kotu?' bad':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){t.remove()}, kotu?4200:2400);
}

/* =================== Veri yükleme =================== */
function yenile(sessiz){
  if(!sessiz){ S.yukleniyor=true; ciz() }
  return call('hepsi').then(function(d){
    S.data=d; S.yukleniyor=false;
    if(S.secMimar && !mimar(S.secMimar)) S.secMimar='';
    if(S.acik && !proje(S.acik)) S.acik=null;
    ciz();
  }).catch(hata);
}
function hata(e){
  S.yukleniyor=false;
  var m=(e&&e.message)||String(e);
  if(/şifre/i.test(m)){ S.girildi=false; S.sifre=''; yaz('sifre',''); ciz(); toast(m,true); return }
  toast(m,true); ciz();
}

function ciz(){
  var root=$('#root');
  if(!S.girildi){ root.innerHTML=girisHTML(); baglaGiris(); return }
  var odak=document.activeElement && document.activeElement.id;
  var konum=odak && document.activeElement.selectionStart;
  var liste=$('.arch-list'), sl=liste?liste.scrollLeft:0, st=liste?liste.scrollTop:0;
  var drb=$('.dr-body'), dst=drb?drb.scrollTop:0;
  root.innerHTML=appHTML();
  liste=$('.arch-list'); if(liste){liste.scrollLeft=sl;liste.scrollTop=st}
  drb=$('.dr-body'); if(drb) drb.scrollTop=dst;
  if(odak){ var el=document.getElementById(odak); if(el){ el.focus(); try{ if(konum!=null) el.setSelectionRange(konum,konum) }catch(e){} } }
  baglaApp();
}

function eslesir(p){
  if(S.filtre==='aktif' && !aktif(p)) return false;
  if(S.filtre==='teslim' && aktif(p)) return false;
  var q=S.ara.toLocaleLowerCase('tr');
  if(q){
    var m=mimar(p.mimarId)||{};
    var hay=[p.kod,p.ad,p.konum,p.tur,p.sorumlu,m.ad,m.firma].join(' ').toLocaleLowerCase('tr');
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function sirala(a,b){
  if(S.filtre==='teslim') return a.kod<b.kod?1:-1;
  var ta=tarih(a.teslim), tb=tarih(b.teslim);
  if(ta&&tb&&+ta!==+tb) return ta-tb; if(ta&&!tb) return -1; if(tb&&!ta) return 1;
  return a.kod<b.kod?1:-1;
}

function baglaApp(){
  var ara=$('#ara');
  if(ara) ara.addEventListener('input',function(){ S.ara=ara.value; ciz() });

  if(drop){
    ['dragenter','dragover'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add('over')})});
    ['dragleave','drop'].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove('over')})});
    drop.addEventListener('drop',function(e){ yukle(e.dataTransfer.files) });
    inp.addEventListener('change',function(){ yukle(inp.files); inp.value='' });
  }
  var f=$('#f'); if(f) f.addEventListener('submit',function(e){ e.preventDefault(); modalTamam() });
  var pl=$('#p-plan');
  if(pl) pl.addEventListener('change',function(){
    var n=pl.files.length; $('#p-plan-ad').textContent = n ? (n===1 ? pl.files[0].name : n+' dosya seçildi') : 'Mimari planı ekleyin';
    $('#p-plan-drop').classList.toggle('over', n>0);
  });
}

document.addEventListener('click',function(e){
  var k=e.target.closest('.secim .kutu');
  if(k){
    var grp=k.parentNode;
    Array.prototype.forEach.call(grp.children,function(b){ b.classList.toggle('on',b===k); b.setAttribute('aria-checked',b===k) });
    if(grp.id==='q-elektrik'||grp.id==='q-mekanik') hizliDurum(grp.id.slice(2), k.getAttribute('data-deger'));
    return;
  }
  var t=e.target.closest('[data-act],[data-mimar],[data-is],[data-filtre],[data-sekme],[data-dsil],[data-grp],[data-yeniis]');
  if(!t) return;
  if(t.hasAttribute('data-grp')){ var g=t.getAttribute('data-grp'); S.kapali[g]=!S.kapali[g]; ciz(); return }
  if(t.hasAttribute('data-yeniis')){ S.modal={tur:'is',mimarId:t.getAttribute('data-yeniis')}; ciz(); odakla('#p-ad'); return }
  if(t.hasAttribute('data-mimar')){ S.secMimar=t.getAttribute('data-mimar'); ciz(); return }
  if(t.hasAttribute('data-is')){ ac(t.getAttribute('data-is')); return }
  if(t.hasAttribute('data-filtre')){ S.filtre=t.getAttribute('data-filtre'); ciz(); return }
  if(t.hasAttribute('data-sekme')){ S.sekme=t.getAttribute('data-sekme'); ciz(); return }
  if(t.hasAttribute('data-dsil')){ dosyaSilSor(t.getAttribute('data-dsil')); return }
  var a=t.getAttribute('data-act');
  if(a==='yeniMimar'){ S.modal={tur:'mimar'}; ciz(); odakla('#m-ad') }
  else if(a==='mimarDuzenle'){ S.modal={tur:'mimar',id:S.secMimar}; ciz() }
  else if(a==='yeniIs'){
    if(!S.data.mimarlar.length){ S.modal={tur:'mimar'}; ciz(); toast('Önce işin geldiği mimarı ekleyin.'); return }
    S.modal={tur:'is'}; ciz(); odakla(S.secMimar?'#p-ad':'#p-mimarId');
  }
  else if(a==='isDuzenle'){ S.modal={tur:'is',id:S.acik}; ciz() }
  else if(a==='kapat'){ S.acik=null; S.dosyalar=null; ciz() }
  else if(a==='modalKapat'){ S.modal=null; ciz() }
  else if(a==='modalTamam'){ modalTamam() }
  else if(a==='isSil'){ var p=proje(S.acik); S.modal={tur:'onay',baslik:p.kod+' '+p.ad+' silinsin mi?',metin:'İşin klasörü ve içindeki tüm dosyalar Drive çöp kutusuna taşınır. 30 gün içinde oradan geri alınabilir.',is:'projeSil',id:p.id,dugme:'İşi sil'}; ciz() }
  else if(a==='mimarSil'){ var m=mimar(S.modal.id); S.modal={tur:'onay',baslik:m.ad+' silinsin mi?',metin:'Mimarın kayıtlı işi yoksa klasörü Drive çöp kutusuna taşınır.',is:'mimarSil',id:m.id,dugme:'Mimarı sil'}; ciz() }
  else if(a==='cikis'){ S.girildi=false; S.sifre=''; yaz('sifre',''); ciz() }
});

  if(e.key!=='Escape') return;

function odakla(s){ setTimeout(function(){ var el=$(s); if(el) el.focus() },30) }

function ac(id){
  S.acik=id; S.sekme='mimari'; S.dosyalar=null; ciz();
  dosyalariGetir();
}
function dosyalariGetir(){
  var id=S.acik;
  return call('dosyalar',{projeId:id}).then(function(d){ if(S.acik===id){ S.dosyalar=d; ciz() } }).catch(hata);
}

function hizliDurum(alan, deger){
  var p=proje(S.acik); if(!p) return;
  var v=Object.assign({},p); v[alan]=deger;
  p[alan]=deger; ciz();
  call('projeKaydet',v).then(function(){ toast('Güncellendi'); yenile(true) }).catch(hata);
}

function modalTamam(){
  var M=S.modal, btn=$('[data-act="modalTamam"]'), err=$('#m-err');
  function bitti(mesaj, sonra){ S.modal=null; toast(mesaj); return yenile(true).then(function(){ if(sonra) sonra() }) }
  function hataGoster(e){ btn.disabled=false; btn.textContent=M.tur==='onay'?(M.dugme||'Sil'):'Kaydet'; err.textContent=e.message }
  var v={};
  if(M.tur==='mimar'){
    ['ad','firma','telefon','eposta','notlar'].forEach(function(k){ v[k]=$('#m-'+k).value.trim() });
    if(!v.ad){ err.textContent='Mimarın adını yazın.'; return }
    if(M.id) v.id=M.id;
  } else if(M.tur==='is'){
    ['mimarId','ad','bedel','notlar'].forEach(function(k){ v[k]=$('#p-'+k).value.trim() });
    if(!v.mimarId){ err.textContent='İşin geldiği mimarı seçin.'; return }
    if(!v.ad){ err.textContent='İşe bir ad verin.'; return }
    v.bedel=String(sayi(v.bedel)||'');
    v.gelis = M.id ? ((proje(M.id)||{}).gelis || iso(bugun())) : iso(bugun());
    var eski=M.id?proje(M.id):{}, ke=$('#p-k-elektrik').checked, km=$('#p-k-mekanik').checked;
    if(!ke && !km){ err.textContent='İş kapsamında Elektrik, Mekanik ya da ikisini birden işaretleyin.'; return }
    v.elektrik = ke ? (eski.elektrik && dd(eski.elektrik)!=='Kapsam dışı' ? dd(eski.elektrik) : 'Bekliyor') : 'Kapsam dışı';
    v.mekanik  = km ? (eski.mekanik  && dd(eski.mekanik)!=='Kapsam dışı'  ? dd(eski.mekanik)  : 'Bekliyor') : 'Kapsam dışı';
    if(M.id) v=Object.assign({}, proje(M.id), v);
    var planlar=Array.prototype.slice.call(($('#p-plan')||{}).files||[]);
    if(M.id) v.id=M.id;
  }
  btn.disabled=true; btn.innerHTML='<span class="spin" style="border-top-color:currentColor"></span>Kaydediliyor';
  if(M.tur==='mimar') call('mimarKaydet',v).then(function(r){ bitti(M.id?'Mimar güncellendi':'Mimar ve klasörü oluşturuldu',function(){ if(!M.id){ S.secMimar=r.id; ciz() } }) }).catch(hataGoster);
  else if(M.tur==='is') call('projeKaydet',v).then(function(r){ bitti(M.id?'İş güncellendi':(r.kod+' açıldı, klasörleri hazır'),function(){
    var pid=M.id||r.id;
    if(!M.id || planlar.length){ ac(pid); S.sekme='mimari'; ciz(); if(planlar.length) yukle(planlar) }
  }) }).catch(hataGoster);
  else if(M.tur==='onay'){
    call(M.is, M.veri||{id:M.id}).then(function(){
      if(M.is==='projeSil'){ S.acik=null; S.dosyalar=null }
      if(M.is==='mimarSil'){ S.secMimar='' }
      if(M.is==='dosyaSil'){ S.modal=null; toast('Dosya silindi'); dosyalariGetir(); yenile(true); return }
      bitti('Silindi');
    }).catch(hataGoster);
  }
}

function dosyaSilSor(fid){
  var f=(S.dosyalar[S.sekme]||[]).find(function(x){return x.id===fid}); if(!f) return;
  S.modal={tur:'onay',baslik:'Dosya silinsin mi?',metin:f.ad+' Drive çöp kutusuna taşınır.',is:'dosyaSil',veri:{projeId:S.acik,disiplin:S.sekme,dosyaId:fid},dugme:'Dosyayı sil'};
  ciz();
}

function yukle(liste){
  var dosyalar=Array.prototype.slice.call(liste||[]); if(!dosyalar.length) return;
  var projeId=S.acik, disiplin=S.sekme;
  var buyuk=dosyalar.filter(function(f){return f.size>MAX_MB*1048576});
  if(buyuk.length) toast(buyuk.map(function(f){return f.name}).join(', ')+': '+MAX_MB+' MB sınırını aşıyor. Bu dosyayı panel sahibi Drive klasörüne doğrudan yüklemeli.',true);
  dosyalar=dosyalar.filter(function(f){return f.size<=MAX_MB*1048576});
  var sira=Promise.resolve();
  dosyalar.forEach(function(f){
    var u={projeId:projeId,disiplin:disiplin,ad:f.name,boyut:f.size};
    S.yuklemeler.push(u);
    sira=sira.then(function(){
      ciz();
      return oku64(f).then(function(b64){
        return call('dosyaYukle',{projeId:projeId,disiplin:disiplin,ad:f.name,tur:f.type||'application/octet-stream',base64:b64,boyut:f.size});
      }).then(function(){ toast(f.name+' eklendi') }).catch(function(e){ toast(f.name+': '+e.message,true) })
        .then(function(){ S.yuklemeler.splice(S.yuklemeler.indexOf(u),1); if(S.acik===projeId) return dosyalariGetir() });
    });
  });
  sira.then(function(){ yenile(true) });
  ciz();
}
function oku64(f){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){ res(String(r.result).split(',')[1]||'') };
    r.onerror=function(){ rej(new Error('Dosya okunamadı')) };
    r.readAsDataURL(f);
  });
}

function demo(islem, v){

      if(islem==='mimarSil'){
        var n=D.projeler.filter(function(p){return p.mimarId===v.id}).length;
        if(n) throw new Error('Bu mimarın '+n+' işi var. Önce işleri silin veya taşıyın.');

        var y=new Date().getFullYear(), mx=0;
        D.projeler.forEach(function(x){ var m=String(x.kod).match(/^(\d{4})-(\d+)$/); if(m&&+m[1]===y) mx=Math.max(mx,+m[2]) });
        var kod=y+'-'+('00'+(mx+1)).slice(-3), nid='p'+Date.now();

      }
      if(islem==='projeSil'){ D.projeler=D.projeler.filter(function(p){return p.id!==v.id}); log('İşi sildi'); return res({ok:true}) }
      if(islem==='dosyalar'){ return res(kopya(D.dosyalar[v.projeId]||{mimari:[],elektrik:[],mekanik:[],belgeler:[]})) }
      if(islem==='dosyaYukle'){
        var F=D.dosyalar[v.projeId]=D.dosyalar[v.projeId]||{mimari:[],elektrik:[],mekanik:[],belgeler:[]};
        F[v.disiplin].unshift({id:'f'+Date.now(),ad:v.ad,boyut:v.boyut,tarih:zaman(0),ekleyen:k});
        var pp=D.projeler.find(function(x){return x.id===v.projeId});
        log(pp.kod+' › dosya ekledi: '+v.ad); return res({ok:true});
      }
      if(islem==='dosyaSil'){ var G=D.dosyalar[v.projeId]; G[v.disiplin]=G[v.disiplin].filter(function(f){return f.id!==v.dosyaId}); return res({ok:true}) }
      throw new Error('Bilinmeyen işlem');
    }catch(e){ rej(e) }
  }, islem==='dosyaYukle'?700:180) });
}
